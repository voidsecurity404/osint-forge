name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./internal/... ./cmd/...

      - name: Test
        run: go test -race ./internal/...

      - name: Build CLI
        run: go build -o /dev/null ./cmd/reconcli
